[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "project-pa"
version = "0.1.0"
description = "Software stack for a glasses-style wearable AI agent: binary framing protocol, hybrid agent engine, gateway, and browser simulators"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Udit Daftary" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.28",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["core*", "agent_engine*", "gateway*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff.lint]
# Correctness-only gate: syntax errors, undefined names, invalid comparisons.
# Unused imports in the existing code are not enforced yet.
select = ["E9", "F63", "F7", "F82"]
